<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>おこづかいポイント v0.4</title>
<style>
  :root{
    --bg:#edf6ea;
    --card:#f7fbf5;
    --text:#2e2a24;
    --muted:#6d665e;
    --line:#b7c9a6;
    --accent:#86b85d;
    --accent2:#b7d77f;
    --good:#6cc28c;
    --danger:#e86f6f;
    --shadow:0 10px 28px rgba(45,69,33,.08);
    --soil:#8b5e3c;
    --wood:#a67c52;
    --sky:#bfe7ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
    background:linear-gradient(180deg,#dff2d8 0%, #eef8ea 55%, #d9eefb 100%);
    color:var(--text);
  }
  .app{max-width:760px;margin:0 auto;padding:18px 14px 90px}
  header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;
  }
  h1{font-size:24px;margin:0;letter-spacing:.04em;text-shadow:1px 1px 0 rgba(255,255,255,.6)}
  .sub{font-size:13px;color:var(--muted);margin-top:3px}
  button{
    border:0;border-radius:10px;padding:11px 14px;
    font-size:15px;font-weight:700;cursor:pointer;
  }
  .primary{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#233018;border-bottom:3px solid #54763a}
  .ghost{background:#fbfdf8;border:1px solid var(--line);color:var(--text);border-bottom:3px solid #c7d7ba}
  .danger{background:#fff0f0;color:#a33;border-bottom:3px solid #e0b1b1}
  .cards{display:grid;gap:12px}
  .person-card{
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    border-radius:12px;padding:16px;cursor:pointer;border-bottom:4px solid var(--soil);
  }
  .person-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .person-name{font-size:20px;font-weight:900;letter-spacing:.06em;font-family:monospace;text-transform:none}
  .today-pts{font-size:30px;font-weight:900;letter-spacing:.06em;font-family:monospace}
  .yen{font-size:14px;color:var(--muted)}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 10px;border-radius:8px;background:#e4f0d6;border:1px solid #b5cb9a;
    font-size:12px;font-weight:700;margin-top:8px;
  }
  .screen{display:none}
  .screen.active{display:block}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .summary{
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    border-radius:12px;padding:18px;margin-bottom:14px;border-bottom:4px solid var(--soil);
  }
  #person .summary{
    position:sticky;
    top:8px;
    z-index:10;
    backdrop-filter:blur(8px);
  }
  .summary h2{margin:0 0 8px;font-size:24px}
  .big{
    font-size:42px;font-weight:900;line-height:1;
    margin:10px 0 6px;
    letter-spacing:.06em;
    font-family:monospace;
    color:#2d4f25;
  }
  .money{color:var(--muted);font-size:14px}
  .task-list{display:grid;gap:10px}
  .task{
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .task-left{min-width:0}
  .task-name{font-weight:800;font-size:17px}
  .task-pts{font-size:13px;color:var(--muted);margin-top:3px}
  .task-actions{display:flex;gap:7px;align-items:center}
  .done{
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    min-width:64px;
    border-bottom:3px solid #54763a;
  }
  .mini{padding:8px 10px;border-radius:11px;font-size:13px}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px;padding:6px 8px;background:rgba(255,255,255,.45);border-radius:8px}
  .section-title h3{margin:0;font-size:17px}
  .empty{
    text-align:center;color:var(--muted);padding:28px 12px;
    background:#fff;border:1px dashed var(--line);border-radius:10px;
  }
  .history-day{
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:9px;
  }
  .history-head{display:flex;justify-content:space-between;font-weight:800}
  .history-item{display:flex;justify-content:space-between;color:#555;font-size:14px;margin-top:6px}
  .modal-back{
    position:fixed;inset:0;background:rgba(0,0,0,.28);
    display:none;align-items:flex-end;justify-content:center;z-index:20;
  }
  .modal-back.show{display:flex}
  .modal{
    width:min(760px,100%);background:#f9fcf5;border-radius:16px 16px 0 0;border-top:4px solid var(--soil);
    padding:18px 16px 24px;box-shadow:0 -12px 35px rgba(0,0,0,.18);
  }
  .modal h3{margin:0 0 14px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
  input{
    width:100%;padding:13px 12px;border-radius:14px;border:1px solid var(--line);
    font-size:16px;
  }
  .modal-actions{display:flex;gap:8px;margin-top:16px}
  .modal-actions button{flex:1}
  .spark{
    position:fixed;pointer-events:none;font-size:28px;
    animation:spark 900ms ease-out forwards;z-index:50;
  }
  @keyframes spark{
    0%{transform:scale(.5) translateY(0);opacity:0}
    20%{transform:scale(1.3) translateY(-8px);opacity:1}
    100%{transform:scale(.9) translateY(-85px);opacity:0}
  }
  .flash{animation:flash .55s ease}
  @keyframes flash{
    0%{transform:scale(1)}
    35%{transform:scale(1.04)}
    100%{transform:scale(1)}
  }
  
  .point-pop{animation:pointPop .48s ease}
  @keyframes pointPop{
    0%{transform:scale(1)}
    35%{transform:scale(1.18)}
    100%{transform:scale(1)}
  }
  .plus-float{
    position:fixed;
    z-index:60;
    pointer-events:none;
    font-family:monospace;
    font-weight:900;
    font-size:26px;
    color:#2d4f25;
    text-shadow:2px 2px 0 rgba(255,255,255,.8);
    animation:plusFloat .85s ease-out forwards;
  }
  @keyframes plusFloat{
    0%{transform:translateY(10px) scale(.8);opacity:0}
    20%{transform:translateY(0) scale(1.15);opacity:1}
    100%{transform:translateY(-60px) scale(1);opacity:0}
  }

  .footer-note{color:var(--muted);font-size:12px;text-align:center;margin-top:20px;background:rgba(255,255,255,.45);padding:8px 10px;border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <section id="home" class="screen active">
    <header>
      <div>
        <h1>⭐ おこづかいポイント</h1>
        <div class="sub">できた！を、目に見えるカタチに。</div>
      </div>
      <button class="primary" onclick="openPersonModal()">＋ 名前追加</button>
    </header>
    <div id="people" class="cards"></div>
    <div class="footer-note">1ポイント = 1円 でスタート中　｜　v0.4</div>
  </section>

  <section id="person" class="screen">
    <header>
      <button class="ghost" onclick="goHome()">← もどる</button>
      <button class="ghost" onclick="showHistory()">履歴を見る</button>
    </header>

    <div class="summary" id="summaryCard">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
        <div>
          <h2 id="personName"></h2>
          <div class="sub" id="todayLabel"></div>
        </div>
        <button class="ghost mini" onclick="openRenameModal()">名前編集</button>
      </div>
      <div class="big"><span id="todayPoints">0</span> pt</div>
      <div class="money">今日のおこづかい換算：<strong><span id="todayYen">0</span>円</strong></div>
    </div>

    <div class="section-title">
      <h3>今日できること</h3>
      <button class="primary mini" onclick="openTaskModal()">＋ やること追加</button>
    </div>
    <div id="tasks" class="task-list"></div>
  </section>

  <section id="history" class="screen">
    <header>
      <button class="ghost" onclick="backToPerson()">← もどる</button>
      <div>
        <h1 style="font-size:20px">📒 ポイント履歴</h1>
        <div class="sub" id="historyName"></div>
      </div>
      <div></div>
    </header>
    <div class="summary">
      <div class="sub">今月の合計</div>
      <div class="big"><span id="monthPoints">0</span> pt</div>
      <div class="money"><span id="monthYen">0</span>円 相当</div>
    </div>
    <div id="historyList"></div>
  </section>
</div>

<div id="personModal" class="modal-back">
  <div class="modal">
    <h3>名前を追加</h3>
    <label>名前</label>
    <input id="newPersonName" placeholder="例：3番ちゃん" />
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal('personModal')">キャンセル</button>
      <button class="primary" onclick="addPerson()">追加する</button>
    </div>
  </div>
</div>

<div id="renameModal" class="modal-back">
  <div class="modal">
    <h3>名前を編集</h3>
    <label>名前</label>
    <input id="renameInput" />
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal('renameModal')">キャンセル</button>
      <button class="primary" onclick="renamePerson()">保存</button>
    </div>
  </div>
</div>

<div id="taskModal" class="modal-back">
  <div class="modal">
    <h3 id="taskModalTitle">やること追加</h3>
    <label>やること</label>
    <input id="taskNameInput" placeholder="例：洗濯物をたたむ" />
    <label>ポイント</label>
    <input id="taskPointsInput" type="number" min="1" step="1" value="10" />
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal('taskModal')">キャンセル</button>
      <button class="primary" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "allowance_points_v01";
let currentPersonId = null;
let editingTaskId = null;

function todayKey(){
  const d = new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function monthKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }

function defaultData(){
  const mkPerson=(name)=>({
    id:uid(), name,
    tasks:[
      {id:uid(), name:"自分で明日の準備", points:10},
      {id:uid(), name:"お手伝い", points:10}
    ],
    history:{}
  });
  return { yenPerPoint:1, people:[mkPerson("1番くん"), mkPerson("2番ちゃん")] };
}

function load(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw){ const d=defaultData(); save(d); return d; }
  try{return JSON.parse(raw)}catch(e){ const d=defaultData(); save(d); return d; }
}
function save(d){ localStorage.setItem(STORAGE_KEY,JSON.stringify(d)); }
let data=load();

function showScreen(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function getPerson(){ return data.people.find(p=>p.id===currentPersonId); }
function todayEntries(p){
  const k=todayKey();
  return p.history[k] || [];
}
function sumEntries(entries){ return entries.reduce((a,b)=>a+(Number(b.points)||0),0); }

function renderHome(){
  const box=document.getElementById("people");
  box.innerHTML="";
  data.people.forEach(p=>{
    const pts=sumEntries(todayEntries(p));
    const div=document.createElement("div");
    div.className="person-card";
    div.onclick=()=>openPerson(p.id);
    div.innerHTML=`
      <div class="person-top">
        <div>
          <div class="person-name">${escapeHtml(p.name)}</div>
          <div class="badge">✨ 今日のがんばり</div>
        </div>
        <div style="text-align:right">
          <div class="today-pts">${pts} pt</div>
          <div class="yen">${pts*data.yenPerPoint}円</div>
        </div>
      </div>`;
    box.appendChild(div);
  });
}
function openPerson(id){
  currentPersonId=id;
  renderPerson();
  showScreen("person");
}
function goHome(){ currentPersonId=null; renderHome(); showScreen("home"); }
function backToPerson(){ renderPerson(); showScreen("person"); }

function renderPerson(){
  const p=getPerson(); if(!p)return;
  document.getElementById("personName").textContent=p.name;
  document.getElementById("todayLabel").textContent=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
  const pts=sumEntries(todayEntries(p));
  document.getElementById("todayPoints").textContent=pts;
  document.getElementById("todayYen").textContent=pts*data.yenPerPoint;
  const list=document.getElementById("tasks");
  list.innerHTML="";
  if(!p.tasks.length){
    list.innerHTML='<div class="empty">まだ「やること」がありません。<br>＋から追加してね。</div>';
    return;
  }
  p.tasks.forEach(t=>{
    const row=document.createElement("div");
    row.className="task";
    row.innerHTML=`
      <div class="task-left">
        <div class="task-name">${escapeHtml(t.name)}</div>
        <div class="task-pts">できたら +${t.points} pt</div>
      </div>
      <div class="task-actions">
        <button class="danger mini">削除</button>
        <button class="ghost mini">編集</button>
        <button class="ghost mini">−1回</button>
        <button class="done">できた！</button>
      </div>`;
    const [deleteBtn, editBtn, minusBtn, doneBtn]=row.querySelectorAll("button");
    deleteBtn.onclick=()=>{
      if(confirm(`「${t.name}」を削除する？`)) deleteTask(t.id);
    };
    editBtn.onclick=()=>openTaskModal(t.id);
    minusBtn.onclick=()=>undoTask(t.id);
    doneBtn.onclick=(e)=>completeTask(t.id,e.currentTarget);
    list.appendChild(row);
  });
}
function completeTask(taskId, btn){
  const p=getPerson(); const t=p.tasks.find(x=>x.id===taskId); if(!t)return;
  const k=todayKey();
  if(!p.history[k]) p.history[k]=[];
  p.history[k].push({id:uid(), taskId:t.id, name:t.name, points:t.points, at:new Date().toISOString()});
  save(data);

  sparkle(btn);
  showPointGain(t.points, btn);

  const card=document.getElementById("summaryCard");
  card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");

  renderPerson();

  const total=document.getElementById("todayPoints");
  total.classList.remove("point-pop"); void total.offsetWidth; total.classList.add("point-pop");
}
function undoTask(taskId){
  const p=getPerson(); if(!p)return;
  const k=todayKey();
  const entries=p.history[k] || [];
  for(let i=entries.length-1;i>=0;i--){
    if(entries[i].taskId===taskId){
      entries.splice(i,1);
      if(entries.length===0) delete p.history[k];
      save(data);
      renderPerson();
      return;
    }
  }
  alert("今日はまだこの項目のポイントを足してないよ。");
}
function sparkle(el){
  const r=el.getBoundingClientRect();
  ["✦","■","✦"].forEach((s,i)=>{
    const x=document.createElement("div");
    x.className="spark"; x.textContent=s;
    x.style.left=(r.left+r.width/2 + (i-1)*22)+"px";
    x.style.top=(r.top-2)+"px";
    document.body.appendChild(x);
    setTimeout(()=>x.remove(),950);
  });
}
function showPointGain(points, el){
  const r=el.getBoundingClientRect();
  const x=document.createElement("div");
  x.className="plus-float";
  x.textContent=`+${points} pt`;
  x.style.left=Math.max(12, r.left + r.width/2 - 28)+"px";
  x.style.top=Math.max(12, r.top - 8)+"px";
  document.body.appendChild(x);
  setTimeout(()=>x.remove(),900);
}

function showHistory(){
  const p=getPerson(); if(!p)return;
  document.getElementById("historyName").textContent=p.name;
  const mk=monthKey();
  const monthDates=Object.keys(p.history).filter(k=>k.startsWith(mk)).sort().reverse();
  let total=0;
  const list=document.getElementById("historyList");
  list.innerHTML="";
  monthDates.forEach(date=>{
    const entries=p.history[date]||[];
    const dayTotal=sumEntries(entries);
    total+=dayTotal;
    const d=document.createElement("div");
    d.className="history-day";
    d.innerHTML=`
      <div class="history-head"><span>${formatDate(date)}</span><span>${dayTotal} pt</span></div>
      ${entries.slice().reverse().map(e=>`<div class="history-item"><span>${escapeHtml(e.name)}</span><span>+${e.points}</span></div>`).join("")}`;
    list.appendChild(d);
  });
  if(!monthDates.length) list.innerHTML='<div class="empty">今月の履歴はまだありません。</div>';
  document.getElementById("monthPoints").textContent=total;
  document.getElementById("monthYen").textContent=total*data.yenPerPoint;
  showScreen("history");
}

function openPersonModal(){
  document.getElementById("newPersonName").value="";
  showModal("personModal");
  setTimeout(()=>document.getElementById("newPersonName").focus(),50);
}
function addPerson(){
  const name=document.getElementById("newPersonName").value.trim();
  if(!name)return;
  data.people.push({id:uid(),name,tasks:[],history:{}});
  save(data); closeModal("personModal"); renderHome();
}
function openRenameModal(){
  const p=getPerson(); if(!p)return;
  document.getElementById("renameInput").value=p.name;
  showModal("renameModal");
}
function renamePerson(){
  const p=getPerson(); const name=document.getElementById("renameInput").value.trim();
  if(!p||!name)return;
  p.name=name; save(data); closeModal("renameModal"); renderPerson();
}

function openTaskModal(taskId=null){
  editingTaskId=taskId;
  const p=getPerson();
  const t=taskId ? p.tasks.find(x=>x.id===taskId) : null;
  document.getElementById("taskModalTitle").textContent=t?"やること編集":"やること追加";
  document.getElementById("taskNameInput").value=t?t.name:"";
  document.getElementById("taskPointsInput").value=t?t.points:10;
  showModal("taskModal");
}
function saveTask(){
  const p=getPerson();
  const name=document.getElementById("taskNameInput").value.trim();
  const points=Math.max(1,parseInt(document.getElementById("taskPointsInput").value||"1",10));
  if(!p||!name)return;
  if(editingTaskId){
    const t=p.tasks.find(x=>x.id===editingTaskId);
    if(t){t.name=name;t.points=points;}
  }else{
    p.tasks.push({id:uid(),name,points});
  }
  save(data); closeModal("taskModal"); renderPerson();
}
function deleteTask(taskId){
  const p=getPerson(); if(!p)return;
  p.tasks=p.tasks.filter(t=>t.id!==taskId); save(data); renderPerson();
}

function showModal(id){ document.getElementById(id).classList.add("show"); }
function closeModal(id){ document.getElementById(id).classList.remove("show"); }
function formatDate(s){
  const [y,m,d]=s.split("-");
  return `${Number(m)}/${Number(d)}`;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
document.querySelectorAll(".modal-back").forEach(m=>{
  m.addEventListener("click",e=>{ if(e.target===m)m.classList.remove("show"); });
});
renderHome();
</script>
</body>
</html>
